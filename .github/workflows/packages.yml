name: Packages

# Build the desktop installers/packages and upload them as workflow artifacts.
# Runs on every push to main (downloadable per-run) and is reused by release.yml
# to attach the same artifacts to a tagged GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build Linux packages
        run: scripts/package-linux.sh

      - name: Collect artifacts
        run: |
          mkdir -p upload
          cp dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.AppImage upload/ 2>/dev/null || true
          if [ -f dist/PKGBUILD ]; then cp dist/PKGBUILD upload/; fi
          ls -lh upload

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: upload/
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Windows packages
        shell: bash
        run: scripts/package-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build macOS packages
        run: scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error
