version: 1
source: rf-routing.zip (mihomo/config.yaml), converted to a neutral form
mirror_default: direct
rule_providers:
  itdog-russia-inside:
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-clashx.lst
    behavior: domain
    format: text
    interval: 86400
  itdog-discord-ip:
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/discord.lst
    behavior: ipcidr
    format: text
    interval: 86400
  itdog-telegram-ip:
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/telegram.lst
    behavior: ipcidr
    format: text
    interval: 86400
