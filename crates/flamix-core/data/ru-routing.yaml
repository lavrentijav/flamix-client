  action: proxy
  names:
  - ?i
  group: DISCORD
- type: process-regex
  value: (?i)^(claude|claude-desktop|claude-code|cursor|codex|chatgpt|windsurf|antigravity|kiro|trae|gemini|opencode|aider|perplexity)( helper.*)?(\.exe)?$
  action: proxy
  names:
  - ?i
- type: process-regex
  value: (?i)^(spotify|applemusic|apple music|itunes|tidal|deezer|youtube music|youtube-music)( helper.*)?(\.exe)?$
  action: proxy
  names:
  - ?i
- type: process-regex
  value: (?i)^(telegram|telegram desktop|telegram-desktop|ayugram|ayugram-desktop|64gram|kotatogram|unigram|nekogram|materialgram|whatsapp(\.root)?|signal|signal-desktop|viber|slack|zoom|zoom\.us|skype|element-desktop)(
    helper.*)?(\.exe)?$
  action: proxy
  names:
  - ?i
- type: process-regex
  value: (?i)^(obs|obs32|obs64|obs-studio|githubdesktop|notion|figma)( helper.*)?(\.exe)?$
  action: proxy
  names:
  - ?i
