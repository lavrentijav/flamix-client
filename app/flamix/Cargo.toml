[package]
name = "flamix"
description = "Flamix — cross-platform VPN client (Xray / sing-box)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "flamix"
path = "src/main.rs"

[dependencies]
flamix-core.workspace = true
flamix-sys.workspace = true
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
chrono.workspace = true
# Only used by the hidden `--screenshot` mode (offscreen software renderer -> PNG).
png = "0.17"
# Workaround for build hosts without libfontconfig (e.g. ru1): build fontique's
# fontconfig backend in dlopen mode so it doesn't need the system library at link time.
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1"

[lints]
workspace = true
