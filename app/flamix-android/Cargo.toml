[package]
name = "flamix-android"
description = "Flamix Android shell (cdylib loaded by NativeActivity)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "flamix_android"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
slint-build = "1"

[dependencies]
flamix-core = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Subscription fetch runs on a current-thread runtime (src/phone.rs) on every platform.
tokio = { workspace = true }
# Slint's android backend (android-activity 0.6). Safe to enable on every target; on the
# host it is simply unused. Renderer: femtovg (same as the desktop app).
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }

# VPN data path (see src/tunnel.rs): the VpnService fd is read in-process by tun2proxy, which
# forwards to the sing-box core's local SOCKS inbound. Unix only: it builds on the Linux host
# (so ru1 clippy/tests cover it) and on Android; the Windows desktop build skips it.
[target.'cfg(unix)'.dependencies]
jni = "0.21"
tun2proxy = { version = "0.8", default-features = false }

[lints]
workspace = true
