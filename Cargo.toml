[workspace]
resolver = "2"
members = ["crates/flamix-core", "crates/flamix-sys", "app/flamix", "app/flamix-android"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lavrentijav/flamix-client"
rust-version = "1.85"

[workspace.dependencies]
flamix-core = { path = "crates/flamix-core" }
flamix-sys = { path = "crates/flamix-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "socks"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
